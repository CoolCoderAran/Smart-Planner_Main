<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar • Smart Planner</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='hub.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='planner.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar.css') }}">
</head>
<body>

    {% include 'navbar.html' %}

    <div class="main-content calendar-page-wrapper">
        <!-- CALENDAR HEADER & CONTROLS -->
        <header class="calendar-header glass-card">
            <div class="calendar-nav-controls">
                <button id="prevMonthBtn" class="nav-btn glass-btn">&larr; Previous</button>
                <h2 id="currentMonthYearDisplay"></h2>
                <button id="nextMonthBtn" class="nav-btn glass-btn">Next &rarr;</button>
                <button id="todayBtn" class="today-btn glass-btn">Today</button>
            </div>
            
            <div class="calendar-view-picker">
                <button class="view-btn glass-btn active" data-view="month">Month</button>
                <button class="view-btn glass-btn" data-view="week">Week</button>
                <button class="view-btn glass-btn" data-view="day">Day</button>
            </div>
        </header>

        <!-- CALENDAR GRID CONTAINER -->
        <main class="calendar-container glass-card">
            <div class="calendar-weekdays">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
        </main>
    </div>

    <!-- Calendar Task Details Modal -->
    <div id="calendarTaskModal" class="modal-overlay">
      <div class="modal-content glass-card">
        <button class="modal-close" onclick="closeCalendarModal()">&times;</button>
        <h3 id="calModalTitle">Task Details</h3>
        <p><strong>Subject:</strong> <span id="calModalSubject"></span></p>
        <p><strong>Due Date:</strong> <span id="calModalDueDate"></span></p>
        <p><strong>Priority:</strong> <span id="calModalPriority"></span></p>
        <p><strong>Est. Time:</strong> <span id="calModalEst"></span> mins</p>
        <p><strong>Status:</strong> <span id="calModalStatus"></span></p>
        
        <div class="modal-actions">
            <button id="calToggleBtn" class="glass-btn">Toggle Complete</button>
            <button id="calEditBtn" class="glass-btn primary">Edit</button>
            <button id="calDeleteBtn" class="glass-btn danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- Edit/Add Task Modal (Matches backend endpoint inputs exactly) -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content glass-card">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modalHeaderTitle">Task Details</h3>
            <form id="addTaskForm">
                <input type="hidden" id="modalTaskId" name="id">
                <div class="form-group">
                    <label for="modalTaskName">Task Title</label>
                    <input type="text" id="modalTaskName" name="title" class="glass-input" required>
                </div>
                <div class="form-group">
                    <label for="modalSubject">Subject</label>
                    <input type="text" id="modalSubject" name="subject" class="glass-input">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="modalEstMinutes">Est. Minutes</label>
                        <input type="number" id="modalEstMinutes" name="estimated_minutes" class="glass-input" value="30">
                    </div>
                    <div class="form-group">
                        <label for="modalPriority">Priority</label>
                        <select id="modalPriority" name="priority" class="glass-input">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="modalDueDate">Due Date</label>
                    <input type="date" id="modalDueDate" name="due_date" class="glass-input">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel glass-btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-submit glass-btn primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Safe Variable Embedding -->
    <script>
        const rawTasksData = {{ (tasks if tasks is defined else []) | tojson | safe }};
        const serverToday = {{ (today_date if today_date is defined else '') | tojson | safe }};
        let currentYear = Number("{{ year | default(2026, true) }}");
        let currentMonth = Number("{{ month | default(10, true) }}");
    </script>
    <script src="{{ url_for('static', filename='planner.js') }}"></script>
    <script src="{{ url_for('static', filename='calendar.js') }}"></script>
</body>
</html>
