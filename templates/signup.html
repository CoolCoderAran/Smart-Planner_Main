<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Smart Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
</head>

<body class="auth-body">
    <div class="auth-container">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Start organizing your tasks smarter.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                <p class="flash-{{ category }}" style="color: #ef4444; margin-bottom: 12px;">{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/signup" method="POST" class="auth-form" onsubmit="validateForm(event)">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required maxlength="50">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Create password (min 12 chars)" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Re-enter password" required>

            <div class="terms-box" style="margin: 16px 0;">
                <input type="checkbox" id="terms" name="terms_accepted" value="true" required>
                <label for="terms">I agree to the <a href="/terms" target="_blank">Terms of Service</a> and am at least 13 years old.</label>
            </div>

            <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Login</a>
        </p>
    </div>

    <script>
        function checkPasswordStrength(pw) {
            let errors = [];
            if (pw.length < 12) errors.push("At least 12 characters");
            if (!/[A-Z]/.test(pw)) errors.push("1 uppercase letter");
            if (!/[a-z]/.test(pw)) errors.push("1 lowercase letter");
            if (!/[0-9]/.test(pw)) errors.push("1 number");
            if (!/[^A-Za-z0-9]/.test(pw)) errors.push("1 symbol");
            return errors;
        }

        function validateForm(event) {
            let pw = document.getElementById("password").value;
            let confirmPw = document.getElementById("confirm_password").value;
            let errors = checkPasswordStrength(pw);

            if (pw !== confirmPw) {
                errors.push("Passwords do not match");
            }

            if (errors.length > 0) {
                event.preventDefault();
                alert("Please resolve the following password requirements:\n- " + errors.join("\n- "));
            }
        }
    </script>
</body>
</html>
